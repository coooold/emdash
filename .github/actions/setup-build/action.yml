name: Setup build environment
description: Install toolchain, deps, and write production env

inputs:
  build-variant:
    description: Build variant to embed (canary | prod)
    required: false
    default: 'prod'
  setup-python:
    description: Set to false when the job image already provides a compatible Python
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.28.2

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: pnpm

    - if: inputs.setup-python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python build tools
      if: inputs.setup-python == 'true'
      shell: bash
      run: python -m pip install --upgrade pip setuptools wheel

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Write production env
      shell: bash
      env:
        BUILD_VARIANT: ${{ inputs.build-variant }}
      run: |
        echo "VITE_BUILD=$BUILD_VARIANT" >> apps/ply-desktop/.env.production
