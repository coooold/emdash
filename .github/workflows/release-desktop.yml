name: Package and release desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    if: github.event_name == 'push' || github.ref == 'refs/heads/main2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(jq -er .version apps/ply-desktop/package.json)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The release tag must be vX.Y.Z and match the desktop package.json version ($version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main2; then
            echo "::error::The release commit must be on main2."
            exit 1
          fi

  package:
    name: Package macOS Apple Silicon
    needs: validate
    runs-on: macos-15
    env:
      NX_DAEMON: 'false'
      VITE_RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build

      - name: Build desktop and its workspace dependencies
        run: pnpm exec nx build @ply/ply-desktop

      - name: Package desktop
        working-directory: apps/ply-desktop
        run: |
          node --experimental-strip-types scripts/release/build.ts \
            --platform mac --arch arm64 --package-only

      - name: Verify download sizes
        working-directory: apps/ply-desktop/release
        shell: bash
        run: |
          for asset in ply-arm64.dmg ply-arm64.zip; do
            test -s "$asset"
            bytes=$(wc -c < "$asset")
            printf '%s: %d bytes\n' "$asset" "$bytes" | tee -a "$GITHUB_STEP_SUMMARY"
            if (( bytes >= 200000000 )); then
              echo "::error::$asset exceeds the 200 MB download limit."
              exit 1
            fi
          done
          test -s latest-mac.yml

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-arm64-installer
          path: apps/ply-desktop/release/ply-arm64.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Upload macOS update assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-arm64-updates
          path: |
            apps/ply-desktop/release/ply-arm64.zip
            apps/ply-desktop/release/ply-*.blockmap
            apps/ply-desktop/release/latest-mac.yml
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-mac-arm64-*
          path: artifacts

      - name: Assemble and checksum release assets
        shell: bash
        run: |
          mkdir release
          for file in artifacts/desktop-mac-arm64-*/*; do
            asset=${file##*/}
            if [[ -e "release/$asset" ]]; then
              echo "::error::Duplicate release asset $asset."
              exit 1
            fi
            cp "$file" "release/$asset"
          done
          cd release
          for asset in ply-arm64.dmg ply-arm64.zip latest-mac.yml; do
            if [[ ! -s "$asset" ]]; then
              echo "::error::Missing release asset $asset."
              exit 1
            fi
          done
          sha256sum -- * > SHA256SUMS

      - name: Publish release after all uploads succeed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_sha=$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq .sha)
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::The release tag no longer points at the packaged commit."
            exit 1
          fi
          marker="<!-- desktop-release run=$GITHUB_RUN_ID sha=$GITHUB_SHA -->"
          if existing=$(gh release view "$GITHUB_REF_NAME" --json isDraft,body 2>/dev/null); then
            if ! jq -e .isDraft <<< "$existing" >/dev/null; then
              echo "::notice::Release $GITHUB_REF_NAME already exists."
              exit 0
            fi
            if ! jq -e --arg marker "$marker" '.body | contains($marker)' <<< "$existing" >/dev/null; then
              echo "::error::An unrelated release draft already exists for $GITHUB_REF_NAME."
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" \
              --generate-notes --notes "$marker"
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
